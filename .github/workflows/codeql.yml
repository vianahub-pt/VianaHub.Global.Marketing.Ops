name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Monday at 6am UTC

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@39644d02662b37c8d39367c086d29ee02a2e7752 # v3.28.18
        with:
          languages: javascript
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@39644d02662b37c8d39367c086d29ee02a2e7752 # v3.28.18

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@39644d02662b37c8d39367c086d29ee02a2e7752 # v3.28.18
        with:
          category: /language:javascript
